models:
  - name: orders
    description: Order overview data mart, offering key details for each order inlcluding if it's a customer's first order and a food vs. drink item breakdown. One row per order.
    columns:
      - name: order_id
        description: The unique key of the orders mart.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: The foreign key relating to the customer who placed the order.
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_total
        description: The total amount of the order in USD including tax.
      - name: ordered_at
        description: The timestamp the order was placed at.
      - name: order_cost
        description: The sum of supply expenses to fulfill the order.
      - name: is_food_order
        description: A boolean indicating if this order included any food items.
      - name: is_drink_order
        description: A boolean indicating if this order included any drink items.

      - name: location_id
        description: The identifier for the location where the order was placed.
      - name: subtotal_cents
        description: The subtotal of the order in cents before tax.
      - name: tax_paid_cents
        description: The amount of tax paid for the order in cents.
      - name: order_total_cents
        description: The total amount of the order in cents including tax.
      - name: subtotal
        description: The subtotal of the order in USD before tax.
      - name: tax_paid
        description: The amount of tax paid for the order in USD.
      - name: order_profit
        description: The profit from the order calculated as subtotal minus tax paid.
      - name: order_items_subtotal
        description: The total price of all items in the order.
      - name: count_food_items
        description: The number of food items in the order.
      - name: count_drink_items
        description: The number of drink items in the order.
      - name: count_order_items
        description: The total number of items in the order.
      - name: customer_order_number
        description: The sequence number of the order for the customer, indicating if it's their first order.
    tests:
      - unique: [order_id]
      - not_null: [order_id, customer_id, ordered_at]
      - relationships:
          - {to: ref('stg_customers'), field: customer_id}
          - {to: ref('locations'), field: location_id}